name: Release

# Obsidian installs a plugin from a GitHub release whose tag is exactly the
# version in manifest.json (no "v"), with main.js and manifest.json attached.
# Push such a tag to publish one: git tag 0.1.0 && git push origin 0.1.0

permissions:
  contents: write

on:
  push:
    tags: ['*.*.*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check the tag matches the manifest
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest.json version $version."
            exit 1
          fi
          if [ "$(node -p "require('./package.json').version")" != "$version" ]; then
            echo "::error::package.json and manifest.json versions differ."
            exit 1
          fi
          if [ "$(node -p "require('./versions.json')['$version'] ?? ''")" = "" ]; then
            echo "::error::versions.json has no entry for $version."
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/main.js dist/manifest.json --title "$GITHUB_REF_NAME" --generate-notes
